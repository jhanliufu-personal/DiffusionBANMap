experiment_name: diffusion_full_imagenet64_flow
output_dir: outputs/diffusion_full_imagenet64_flow_grad_accum_ema

# Data — run scripts/prepare_imagenet64_dataset.py first (expects
# <data_dir>/train_images.npy and <data_dir>/val_images.npy already consolidated).
# On Colab, point this at local runtime disk (e.g. /content/data/imagenet64),
# not the Drive mount — the .npy is memory-mapped and needs fast random access.
dataset_type: imagenet64
data_dir: data/imagenet64
batch_size: 32

# UNet — matches the ADM ImageNet-64 config used by the original Flow Matching
# paper (Lipman et al. 2023) for its ImageNet experiments.
in_channels: 3
image_size: 64
model_channels: 192
channel_mult: [1, 2, 3, 4]
num_res_blocks: 3
attention_resolutions: [32, 16, 8]
num_head_channels: 64
dropout: 0.1

# Diffusion / flow matching
unconditional: false
noise_process: flow
num_timesteps: 1000        # sinusoidal embedding scale only; flow itself uses t in [0,1]
cfg_uncond_prob: 0.1
# Conditioning latents: {train,val}_latents_z{latent_dim}.npy in
# <data_dir>/../{dataset_type}_{encoding_model}_pca_latents, written by
# scripts/extract_image_embeddings.py (--model takes the same names as encoding_model).
# encoding_model: alexnet_fc6
encoding_model: dinov2_vitb14
latent_dim: 200

# Optimizer
lr: 1.0e-4
weight_decay: 0.0
max_grad_norm: 1.0
mixed_precision: bf16   # Ampere+ native bf16, no loss-scaling needed; halves activation memory

# LR schedule + EMA — the Flow Matching paper reuses the Dhariwal & Nichol (2021) ADM
# training recipe for its ImageNet experiments, which trains at a constant LR and relies
# on EMA (not LR decay) to stabilize sampling — see utils.build_lr_scheduler / models/ema.py
# for the citations and reasoning behind these choices.
lr_schedule: constant     # paper/ADM default; set to 'polynomial' + lr_poly_power/lr_warmup_steps to try decay instead
ema_decay: 0.9999         # standard ADM/Flow-Matching value; sample from ema_state_dict, not the raw weights

# Training
# batch_size=32 is sized for a single A100 40GB at this model size (~280M params);
# raise it if you have an 80GB card. grad_accum_steps makes up the rest of the way
# to the paper's effective batch of 2048 (32 * 64 = 2048) without raising peak
# activation memory past one micro-batch. num_steps is a fraction of the paper's
# training budget — bump it up for longer Colab/local runs, resuming with --resume.
grad_accum_steps: 16
num_steps: 500000
ckpt_interval: 25000  # uniform checkpoint every 25k steps (20 total) for a FID-vs-compute curve
log_interval: 100
eval_interval: 400
# resume_ckpt_path: outputs/diffusion_full_imagenet64_flow_grad_accum_ema_h64_mc192_ch1x2x3x4_T1000_flow_z50/checkpoints/ckpt_step_0200000.pt
# reset_step_on_resume: false