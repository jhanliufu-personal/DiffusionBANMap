experiment_name: betavae_overfit_cfd
output_dir: outputs/betavae_overfit_cfd

# Data
dataset_type: cfd
data_dir: /home/jhanliufu/RutishauserLab/DATA/cfd/cfd/CFD Version 3.0/Images/CFD
expressions: [N, A, F, HC, HO]
train_split: 0.8
batch_size: 8

# Model
input_channels: 3
input_height: 64
input_width: 64
latent_dim: 10
hidden_dim: 128
beta: 2.0

# Optimizer
lr: 1.0e-4
weight_decay: 1.0e-5
max_grad_norm: 3000.0

# Training
num_epochs: 200
log_interval: 1
eval_interval: 5
ckpt_interval: 20
