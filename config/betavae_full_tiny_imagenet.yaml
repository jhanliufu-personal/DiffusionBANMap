experiment_name: betavae_full_tiny_imagenet
output_dir: outputs/betavae_full_tiny_imagenet

# Data
dataset_type: tiny_imagenet
data_dir: /content/tiny-imagenet-200
train_split: 0.8
batch_size: 32

# Model
input_channels: 3
input_height: 64
input_width: 64
latent_dim: 10
hidden_dim: 128
beta: 4.0

# Optimizer
lr: 1.0e-4
weight_decay: 1.0e-5
max_grad_norm: 3000.0

# Training
num_epochs: 200
log_interval: 1
eval_interval: 5
